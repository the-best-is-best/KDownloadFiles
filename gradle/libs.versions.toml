[versions]

coreVersion = "1.19.1"
kotlin = "2.4.20"
compose = "1.12.2"
agp = "9.2.0"
androidx-activityCompose = "1.13.0"
kotlinxCoroutinesCore = "1.11.0"
core = "1.6.1"
kpermissions = "2.0.1"
material3 = "1.12.0-alpha03"
startupRuntime = "1.2.0"
ktor = "3.6.0"
maven-publish = "0.35.0"
compileSdk = "37"
targetSdk = "37"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"
junit = "4.13.2"
robolectric = "4.18.1"
androidxComposeUiTestManifest = "1.12.1"

[libraries]

androidx-activityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreVersion" }
components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
core = { module = "androidx.core:core", version.ref = "coreVersion" }
foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
html-core = { module = "org.jetbrains.compose.html:html-core", version.ref = "compose" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidxComposeUiTestManifest" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startupRuntime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesCore" }
kpermissions-notification = { module = "io.github.the-best-is-best:kpermissions-notification", version.ref = "kpermissions" }
ktor-client-apache5 = { module = "io.ktor:ktor-client-apache5", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
the-best-is1-best-kpermissions-core = { module = "io.github.the-best-is-best:kpermissions-core", version.ref = "kpermissions" }
ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }
ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose" }
[plugins]

multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
js-plain-objects = { id = "org.jetbrains.kotlin.plugin.js-plain-objects", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
android-application = { id = "com.android.application", version.ref = "agp" }
#hotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "hotReload" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
